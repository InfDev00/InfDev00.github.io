baseURL: "https://infdev00.github.io/"
locale: "ko-kr"
title: "InfDev00 DevBlog"
theme: PaperMod

# 1. 메뉴 설정 (Home, About, GitHub)
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 10
    - name: "About"
      url: "/about/"
      weight: 20
    - name: "GitHub"
      url: "https://github.com/InfDev00"
      weight: 30

# 2. PaperMod 테마 상세 설정
params:
  env: production
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  
  mainSections:
    - posts
    - algorithms
    - unity
    - ai

# 3. HTML 태그 허용 설정 (About 페이지의 카드/스택 정상 노출용)
markup:
  goldmark:
    renderer:
      unsafe: true