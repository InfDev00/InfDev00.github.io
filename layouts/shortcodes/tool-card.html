{{- $title := .Get "title" -}}
{{- $description := .Get "description" -}}
{{- $image := .Get "image" -}}

<div class="tool-card">
    {{ if $image }}
    <div class="tool-card-icon">
        <img src="{{ $image }}" alt="{{ $title }}">
    </div>
    {{ end }}
    <div class="tool-card-body">
        {{ if $title }}<div class="tool-card-title">{{ $title }}</div>{{ end }}
        {{ if $description }}<div class="tool-card-desc">{{ $description }}</div>{{ end }}
    </div>
</div>
