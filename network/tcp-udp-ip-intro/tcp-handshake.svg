<svg xmlns="http://www.w3.org/2000/svg" width="240" height="268" viewBox="0 0 240 268">
  <defs>
    <marker id="tcp-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="240" height="268" fill="#f8fafc" rx="8"/>

  <!-- Client / Server 노드 -->
  <rect x="15" y="18" width="60" height="26" rx="5" fill="white" stroke="#10b981" stroke-width="1.5"/>
  <text x="45" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#065f46">Client</text>

  <rect x="165" y="18" width="60" height="26" rx="5" fill="white" stroke="#10b981" stroke-width="1.5"/>
  <text x="195" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#065f46">Server</text>

  <!-- lifeline -->
  <line x1="45" y1="44" x2="45" y2="200" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="195" y1="44" x2="195" y2="200" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- SYN -->
  <line x1="45" y1="75" x2="195" y2="75" stroke="#10b981" stroke-width="2" marker-end="url(#tcp-arrow)"/>
  <text x="120" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#065f46">SYN</text>

  <!-- SYN-ACK -->
  <line x1="195" y1="125" x2="45" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#tcp-arrow)"/>
  <text x="120" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#065f46">SYN-ACK</text>

  <!-- ACK -->
  <line x1="45" y1="175" x2="195" y2="175" stroke="#10b981" stroke-width="2" marker-end="url(#tcp-arrow)"/>
  <text x="120" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#065f46">ACK</text>

  <!-- 캡션 -->
  <text x="120" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#047857">연결 수립 (3-way handshake)</text>
  <text x="120" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">순서·재전송 보장</text>
</svg>
