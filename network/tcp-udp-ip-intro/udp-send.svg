<svg xmlns="http://www.w3.org/2000/svg" width="240" height="268" viewBox="0 0 240 268">
  <defs>
    <marker id="udp-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="240" height="268" fill="#f8fafc" rx="8"/>

  <!-- Client / Server 노드 -->
  <rect x="15" y="18" width="60" height="26" rx="5" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="45" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Client</text>

  <rect x="165" y="18" width="60" height="26" rx="5" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Server</text>

  <!-- lifeline -->
  <line x1="45" y1="44" x2="45" y2="200" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="195" y1="44" x2="195" y2="200" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Data 1 -->
  <line x1="45" y1="70" x2="195" y2="70" stroke="#3b82f6" stroke-width="2" marker-end="url(#udp-arrow)"/>
  <text x="120" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Data</text>

  <!-- Data 2 -->
  <line x1="45" y1="112" x2="195" y2="112" stroke="#3b82f6" stroke-width="2" marker-end="url(#udp-arrow)"/>
  <text x="120" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Data</text>

  <!-- Data 3 -->
  <line x1="45" y1="154" x2="195" y2="154" stroke="#3b82f6" stroke-width="2" marker-end="url(#udp-arrow)"/>
  <text x="120" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Data</text>

  <!-- 응답 없음 표시 -->
  <line x1="195" y1="188" x2="45" y2="188" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="115" y1="183" x2="125" y2="193" stroke="#ef4444" stroke-width="2"/>
  <line x1="125" y1="183" x2="115" y2="193" stroke="#ef4444" stroke-width="2"/>

  <!-- 캡션 -->
  <text x="120" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">확인 응답 없음</text>
  <text x="120" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">재전송·순서 보장 없음</text>
</svg>
